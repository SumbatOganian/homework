<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="stylesheet" href="./css/normalize.css" />
		<link rel="stylesheet" href="./css/fonts.css" />
		<link rel="stylesheet" href="./css/style.css" />
		<title>Document</title>
	</head>
	<body>
		<section class="registration-card">
			<section class="logo-side">
				<div class="logo-wrapper">
					<img class="logo" src="./assets/nova-logo-mark.png" alt="" />
					<span class="logo-name">NOVA</span>
				</div>
				<div class="texts">
					<h2>Начните создавать новое</h2>
					<p>Один аккаунт - все возможности платформы.</p>
				</div>
			</section>
			<form class="registration-form">
				<fieldset class="form-enter-group">
					<legend class="form-group-title">Создать аккаунт</legend>
					<p>Заполните данные — это займёт меньше минуты</p>
					<button class="google-form">Продолжить с Google</button>
					<button class="apple-form">Продолжить с Apple</button>
				</fieldset>
				<span class="or">или</span>
				<fieldset class="form-group">
					<label for="name">Имя</label>
					<input type="text" id="name" placeholder="Введите ваше имя" / required>
					<label for="email">Электронная почта</label>
					<input type="email" id="email" placeholder="name@example.com" / required>
					
						
					<label for="password">Пароль</label>
					<div class="wrapper-for-toggle">
					<input type="password" id="password" placeholder="Введите пароль" / required>
					<button class="eye-button" type="button" aria-label="Показать пароль"></button>
					</div>
					</div>
				</fieldset>
				<div class="checkbox-wrapper">
					<input type="checkbox" name="" id="check" / required>
					<label for="check" class="checkbox-label">
						Я принимаю
						<a href="#" class="check-text-mod">Условия использования</a> и
						<a href="#" class="check-text-mod">Политику конфиденциальности</a>
					</label>
				</div>
				<button class="form-button" type="submit">Создать аккаунт</button>
				<section class="has-account">
					<span>Уже есть  аккаунт?</span>
					<a href="">Войти</a>
				</section>
			</form>
			
		</section>
		<script src="script.js"></script>
	</body>
</html>
